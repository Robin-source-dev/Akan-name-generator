<body>
    <h1>Akan name page</h1>
    <p>
        This is a simple web application that calculates the day of the week a user was born and assigns them an Akan name based on their gender. Akan names come from Ghanaian culture, where children are named based on the day they were born.
    </p>

    <form >
        <label for="Birthdate">Birthdate</label><br>
        <input type="number" value="Birthdate" id="Bdate"><br><br>
        <label for="gender">Gender</label><br>
        <input type="text" id="Gender" placeholder="Enter your Gender"><br><br>

        <input type="reset" value="Clear">
        <input type="submit" value="submit">

    </form>

    <section>

    </section>
</body>
